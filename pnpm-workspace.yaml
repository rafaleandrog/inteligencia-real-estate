packages:
  - 'apps/*'

# Versões compartilhadas pelas apps, num lugar só. Cada pacote referencia
# `catalog:`. O @urbiverso/sdk fica em versão EXATA, sem ^: o major dele é o
# sdk_min que a app declara, então subir é ato deliberado.
catalog:
  '@types/express': ^4.17.21
  '@types/node': ^20.14.0
  '@urbiverso/sdk': '100.0.0'
  esbuild: ^0.24.0
  express: ^4.21.0
  fflate: ^0.8.2
  lit: ^3.2.0
  tsx: ^4.19.0
  typescript: ^5.6.0

allowBuilds:
  esbuild: false
