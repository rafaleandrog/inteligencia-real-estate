# Gera data/public/ a partir das fontes públicas e abre/atualiza a PR de dados.
#
# - Mensal (dia 1, 06:17 UTC) e manual (workflow_dispatch).
# - Secret não entra em `if:`: o job `guard` exporta a presença como output (mesmo padrão
#   `has_key` documentado em docs/AI_WORKFLOW.md).
# - A credencial de nuvem só é materializada no job `extrair-bigquery`, que NUNCA commita
#   (docs/ENGINEERING_RULES.md, R4.10). O job que commita só adiciona data/public/**.
# - PR criada com GITHUB_TOKEN não dispara workflows de `pull_request`; por isso o último
#   passo dispara os validadores na branch da PR via `gh workflow run`. Alternativa: um PAT
#   fine-grained em `token:` do create-pull-request.
# - Mês sem mudança = bytes idênticos = `git diff --quiet` = sem PR.
name: dados-publicos

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      datasets:
        description: "all ou lista separada por espaço: ra_crosswalk households_grid jobs_hex road_centrality ra_aggregates"
        default: all
        type: string
      refresh:
        description: Ignorar o cache de downloads
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dados-publicos
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      has_gcp: ${{ steps.check.outputs.has_gcp }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "has_gcp=true" >> "$GITHUB_OUTPUT"; else echo "has_gcp=false" >> "$GITHUB_OUTPUT"; fi

  extrair-bigquery:
    # Fase 2 (RAIS 2023 por CEP). Só roda com o secret; nunca commita — sobe um artefato.
    needs: guard
    if: needs.guard.outputs.has_gcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r pipeline/requirements-validate.txt "google-cloud-bigquery==3.27.0" "db-dtypes==1.3.1"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: PYTHONPATH=pipeline python -m imob_pipeline extract rais --year 2023 --out "$RUNNER_TEMP/bq/rais_2023.json"
        env:
          BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: bq-extract
          path: ${{ runner.temp }}/bq
          retention-days: 7
          if-no-files-found: ignore

  gerar:
    needs: [guard, extrair-bigquery]
    if: always() && needs.guard.result == 'success' && (needs.extrair-bigquery.result == 'success' || needs.extrair-bigquery.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - name: Dependências do sistema (osmium para recortar o PBF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool

      - id: month
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache de downloads brutos
        uses: actions/cache@v4
        with:
          path: pipeline/.cache/raw
          key: raw-${{ hashFiles('pipeline/config/df.toml') }}-${{ steps.month.outputs.ym }}
          restore-keys: |
            raw-${{ hashFiles('pipeline/config/df.toml') }}-
            raw-

      - run: pip install -r pipeline/requirements.txt

      - uses: actions/download-artifact@v4
        if: needs.extrair-bigquery.result == 'success'
        with:
          name: bq-extract
          path: ${{ runner.temp }}/bq

      - name: Gerar
        env:
          DATASETS: ${{ inputs.datasets || 'all' }}
          REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
        run: PYTHONPATH=pipeline python -m imob_pipeline run $DATASETS --out data/public --config pipeline/config/df.toml $REFRESH

      - name: Validar
        run: PYTHONPATH=pipeline python -m imob_pipeline validate data/public --config pipeline/config/df.toml

      - name: Testes do pipeline (stack completa)
        run: python -m unittest discover -s pipeline/tests -t pipeline -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-pipeline
          path: pipeline/.cache/runs
          retention-days: 30
          if-no-files-found: ignore

      - id: diff
        run: |
          if git diff --quiet -- data/public && [ -z "$(git status --porcelain -- data/public)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Corpo da PR
        if: steps.diff.outputs.changed == 'true'
        run: PYTHONPATH=pipeline python -m imob_pipeline pr-body --out data/public --to pipeline/.cache/pr_body.md --summary pipeline/.cache/runs/latest/summary.json

      - id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: data/public/**
          branch: dados-publicos/atualizacao
          delete-branch: true
          commit-message: "Atualizar dados públicos derivados (pipeline, ${{ steps.month.outputs.ym }})"
          title: "Dados públicos — atualização ${{ steps.month.outputs.ym }}"
          body-path: pipeline/.cache/pr_body.md
          labels: type:chore,dados-publicos

      - name: Disparar validações na branch da PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run validate.yml --ref dados-publicos/atualizacao
          gh workflow run validate-dados-publicos.yml --ref dados-publicos/atualizacao
