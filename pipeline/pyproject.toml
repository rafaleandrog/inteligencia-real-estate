[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imob-pipeline"
version = "0.1.0"
description = "Pipeline de dados públicos do Imob Intelligence (DF): IBGE, Ipea/AOP, OpenStreetMap, GeoPortal/SEDUH → data/public/"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
validate = ["jsonschema==4.23.0"]
geo = [
  "numpy==2.1.3", "pandas==2.2.3", "shapely==2.0.6", "pyproj==3.7.0", "pyogrio==0.10.0",
  "geopandas==1.0.1", "h3==4.1.2", "networkx==3.4.2", "osmnx==2.0.1", "igraph==0.11.8",
  "jsonschema==4.23.0",
]
bigquery = ["google-cloud-bigquery==3.27.0", "db-dtypes==1.3.1"]
warehouse = ["duckdb==1.1.3", "pyarrow==18.1.0"]

[tool.setuptools.packages.find]
include = ["imob_pipeline*"]
